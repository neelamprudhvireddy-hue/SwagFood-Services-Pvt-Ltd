<section *ngIf="!loading; else loadingTemplate" class="container">
  <div class="header">
    <h2>Restaurant Payouts</h2>
    <div class="controls">
      <input type="text" placeholder="Search restaurant..." (input)="onSearch($any($event.target).value)" />
      <select (change)="onSort($any($event.target).value)">
        <option value="restaurant">Sort by Name</option>
        <option value="orders">Sort by Orders</option>
        <option value="amount">Sort by Amount</option>
      </select>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <span>Name</span>
      <span>Orders</span>
      <span>Amount</span>
    </div>

    <div *ngIf="payoutList.length > 0; else noData">
      <div class="table-row" *ngFor="let item of payoutList">
        <span>{{ item.restaurant }}</span>
        <span>{{ item.orders }}</span>
        <span class="amount">₹{{ item.amount }}</span>
      </div>
    </div>
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="!hasPrevious">Prev</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="!hasNext">Next</button>
  </div>
</section>

<ng-template #loadingTemplate>
  <div class="loading">Loading data...</div>
</ng-template>

<ng-template #noData>
  <div class="no-data">No data found</div>
</ng-template>
