<section class="admin-section">
  <header>
    <div>
      <p class="eyebrow">Order Operations</p>
      <h1>Live order board</h1>
    </div>
    <select>
      <option>Status: All</option>
      <option>Placed</option>
      <option>Cooking</option>
      <option>Out for delivery</option>
    </select>
  </header>

  <div class="table" *ngIf="orders$ | async as orders; else loading">
    <div class="table__head">
      <span>Order</span>
      <span>Restaurant</span>
      <span>Status</span>
      <span>Total</span>
      <span>Created</span>
    </div>
    <div class="table__row" *ngFor="let order of orders">
      <span>{{ order.id }}</span>
      <span>{{ order.restaurantName }}</span>
      <span class="status">{{ order.status }}</span>
      <span>&#8377;{{ order.totalAmount | number: '1.0-0' }}</span>
      <span>{{ order.createdAt | date: 'short' }}</span>
    </div>
  </div>
  <ng-template #loading>
    <p class="loading">Loading orders...</p>
  </ng-template>
</section>
