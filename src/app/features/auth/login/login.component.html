<section class="login-card">
  <h1>Welcome back</h1>
  <p>Sign in to manage your Account</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" placeholder="you@example.com" formControlName="email" />
      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Enter a valid email
      </small>
    </label>
    <label>
      Password
      <input type="password" placeholder="********" formControlName="password" />
      <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Password must be at least 6 characters
      </small>
    </label>
    <label class="remember">
      <input type="checkbox" formControlName="remember" />
      Keep me signed in
    </label>
    <p class="error" *ngIf="error">{{ error }}</p>
    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Signing in...' : 'Continue' }}
    </button>
  </form>
</section>
